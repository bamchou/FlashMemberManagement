name: Push Notification Cron

on:
  schedule:
    - cron: '*/5 * * * *'  # 5分ごとに実行
  workflow_dispatch:         # 手動実行も可能

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Send push notifications
        run: |
          curl -s -f \
            "https://flash-member-management.vercel.app/api/push/send?secret=${{ secrets.CRON_SECRET }}" \
            | echo "Response: $(cat)"
